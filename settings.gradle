pluginManagement {
    repositories {
        google()
        // Miroir de Maven Central hébergé par Google (plus fiable depuis GitHub Actions)
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}
rootProject.name = "APP-Collecte-GNSS"
include ':app'
